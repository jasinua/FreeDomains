name: Validate Domain Request

# SECURITY: Use `pull_request` (NOT `pull_request_target`).
# `pull_request_target` runs in the base repo's context and exposes secrets
# to untrusted fork code — never use it here.
on:
  pull_request:
    branches: [main]
    paths:
      - 'domains/**'
    types: [opened, synchronize, reopened]

permissions:
  contents: read          # only needs to read the repo
  pull-requests: write    # needed to post status check annotations

jobs:
  validate:
    name: Validate domain JSON
    runs-on: ubuntu-latest

    steps:
      # Pin to a specific commit SHA, not just a tag.
      # Tags can be moved by an attacker who compromises the actions repo.
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # full history needed for git diff

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      # Fetch the base branch so the diff reference is available locally
      - name: Fetch base branch
        run: git fetch --depth=1 origin "$GITHUB_BASE_REF"

      - name: Run validator
        # SECURITY: Pass PR author via env var, NEVER inline ${{ ... }} in `run:`.
        # Inlining would allow a crafted PR title/branch to inject shell commands.
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/validate.js
